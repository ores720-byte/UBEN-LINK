<style>

  [hidden]{display:none!important}

  .navitem.on{background:rgb(var(--ac2s));color:rgb(var(--ac2))}.navitem.on i{color:rgb(var(--ac2))}

  html.dark .chip{background:#1a1d24;color:#d1d5db;border-color:#2a2f3a}

  .pill{display:inline-flex;align-items:center;font-size:.7rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;background:#f3f4f6;color:#4b5563;white-space:nowrap}

  #drawer{position:fixed;inset:0 auto 0 0;width:272px;max-width:86vw;background:#fff;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:0 20px 50px rgba(17,24,39,.2);display:flex;flex-direction:column;padding:1rem .75rem;overflow-y:auto}

  html.dark .btn-bad{background:#1a1d24}
  html.dark .navitem{color:#d1d5db}html.dark .navitem:hover{background:#20242d}html.dark .navitem.on{background:#2a2140;color:#c4b5fd}
  html.dark .row+.row{border-color:#2a2f3a}
  html.dark .pill{background:#252a35;color:#cbd5e1}html.dark .pill.good{background:#0f3324;color:#6ee7b7}html.dark .pill.warn{background:#3a2c0c;color:#fcd34d}html.dark .pill.bad{background:#3b1514;color:#fca5a5}
  html.dark .ico{background:#2a2140;color:#c4b5fd}
  html.dark .stat .n{color:#e9d5ff}
  html.dark .bg-gray-50{background:#20242d}
</style>

<script>
const SB_URL = 'https://msrxiamnaiptaplxggwk.supabase.co';
const SB_KEY = 'sb_publishable_ZCPI1DkOc4DYKx6eKkEdtw_2fwRWayY';
// Only this account can open the page. Row Level Security in Supabase is the real protection.
const ADMIN = 'ores720@gmail.com';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
let me = null, rid = 0;

const $ = id => document.getElementById(id);
const DAY = 864e5;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => d ? new Date(d).toLocaleString('en-NG', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const active = d => !!d && new Date(d) > new Date();
const digits = s => String(s ?? '').replace(/\D/g, '');
const REASON = { keyword: 'Flagged word', helper: 'Helper asked', plan_request: 'Plan request', user_reply: 'Student replied' };
const pill = (t, tone = '') => `<span class="pill ${tone}">${esc(t)}</span>`;
const planPill = b => active(b.pro_until)
  ? pill('Pro until ' + new Date(b.pro_until).toLocaleDateString('en-NG', { day: 'numeric', month: 'short' }), 'pro')
  : active(b.featured_until) ? pill('Featured', 'warn') : pill('Free');
const empty = (icon, t) => `<div class="empty"><i class="fa-solid ${icon}"></i><b>${esc(t)}</b></div>`;
const item = (q, left, right = '') => `<div class="row" data-q="${esc(String(q).toLowerCase())}"><div class="grow">${left}</div>${right ? `<div class="acts">${right}</div>` : ''}</div>`;
const search = ph => `<input class="input mb-3" data-search placeholder="${ph}">`;
const sec = (t, s, list, icon, none, extra = '') => `<section class="card sec"><h2 class="text-lg font-bold">${t}</h2>${s ? `<p class="meta mb-2">${s}</p>` : ''}${extra}${list || empty(icon, none)}</section>`;
const people = async ids => {
  if (!ids.length) return {};
  const { data } = await sb.from('profiles').select('id, full_name, email').in('id', ids);
  return Object.fromEntries((data || []).map(p => [p.id, p]));
};
const audit = (action, target, detail) => sb.from('audit_logs').insert({
  admin_id: me.id, action, target_id: target != null ? String(target) : null, detail: detail != null ? String(detail) : null
});
async function fn(action, body = {}) {
  const { data, error } = await sb.functions.invoke('ai-proxy', { body: { action, ...body } });
  if (error) {
    let m = error.message;
    try { m = (await error.context.json()).error || m; } catch (_) {}
    // Network-level failure: the page never got a reply from the function
    if (/failed to send/i.test(m)) m = 'Could not reach ai-proxy. Check that it is deployed to this project. Test address: ' + SB_URL + '/functions/v1/ai-proxy';
    throw new Error(m);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}
function toast(msg, tone = 'ok') {
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + tone;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ''), 3200);
}
function setDark(on) {
  document.documentElement.classList.toggle('dark', on);
  localStorage.setItem('uw_dark', on ? '1' : '0');
  $('dark').innerHTML = `<i class="fa-regular ${on ? 'fa-sun' : 'fa-moon'} text-gray-600"></i>`;
}
function drawer(open) { $('drawer').classList.toggle('open', open); $('scrim').hidden = !open; }
function setB(k, n) { const el = document.querySelector(`[data-badge="${k}"]`); if (el) el.innerHTML = n ? pill(n, 'warn') : ''; }
function setBadge(n) { setB('support', n); }
async function badgeCount() {
  try { const { items } = await fn('support-list'); setBadge(items.length); } catch (_) {}
  try {
    const [ids, reps] = await Promise.all([
      sb.from('student_verifications').select('user_id', { count: 'exact', head: true }).eq('status', 'pending'),
      sb.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open'),
    ]);
    setB('approvals', ids.count); setB('moderation', reps.count);
  } catch (_) {}
}

// ============ PAGES: each returns HTML ============
let an = null, anView = 'numbers', anDays = 30;
const PAL = ['rgb(var(--ac))', '#0ea5e9', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#64748b', '#ec4899'];
const num = n => Number(n || 0).toLocaleString('en-NG');
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
async function allRows(build) {
  let all = [];
  for (let from = 0; from < 10000; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    all = all.concat(data || []);
    if ((data || []).length < 1000) break;
  }
  return all;
}
function daily(rows, test, n) {
  const keys = Array.from({ length: n }, (_, i) => dayKey(Date.now() - (n - 1 - i) * DAY));
  const m = Object.fromEntries(keys.map(k => [k, 0]));
  rows.forEach(r => { if (test(r)) { const k = dayKey(r.created_at); if (k in m) m[k]++; } });
  return keys.map(k => ({ k, v: m[k] }));
}
const dlab = k => new Date(k + 'T00:00').toLocaleDateString('en-NG', { day: 'numeric', month: 'short' });
const legend = items => `<div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs meta">${items.map(i => `<span class="inline-flex items-center gap-1.5"><span style="width:10px;height:10px;border-radius:3px;background:${i.c}"></span>${esc(i.l)}${i.v != null ? ' · ' + num(i.v) : ''}</span>`).join('')}</div>`;
const chartCard = (t, s, body) => `<section class="card sec"><h2 class="text-lg font-bold">${t}</h2>${s ? `<p class="meta mb-3">${s}</p>` : ''}${body}</section>`;
const axisTxt = 'fill:#9ca3af;font-size:10px';

function hbars(items) {
  if (!items.length) return empty('fa-chart-simple', 'No data yet.');
  const max = Math.max(1, ...items.map(i => i.v));
  return `<div class="space-y-3">${items.map((i, x) => `<div><div class="flex justify-between gap-3 text-sm mb-1"><span class="name truncate">${esc(i.l)}</span><span class="meta">${num(i.v)}</span></div><div style="height:10px;border-radius:999px;background:rgba(148,163,184,.22)"><div style="height:100%;width:${Math.max(2, i.v / max * 100)}%;border-radius:999px;background:${PAL[x % PAL.length]}"></div></div></div>`).join('')}</div>`;
}
function frame(max, n) {
  const W = 600, H = 230, pl = 34, pr = 10, pt = 12, pb = 26;
  const x = i => pl + (n > 1 ? i * (W - pl - pr) / (n - 1) : (W - pl - pr) / 2);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const grid = [0, .5, 1].map(t => Math.round(max * t)).map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(148,163,184,.3)"/><text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end" style="${axisTxt}">${t}</text>`).join('');
  return { W, H, pl, pr, x, y, grid };
}
function xlabels(f, data) {
  const n = data.length;
  return [0, Math.floor((n - 1) / 2), n - 1].map(i => `<text x="${f.x(i)}" y="${f.H - 6}" text-anchor="middle" style="${axisTxt}">${dlab(data[i].k)}</text>`).join('');
}
function lineChart(lines) {
  const n = lines[0].data.length;
  const f = frame(Math.max(1, ...lines.flatMap(l => l.data.map(d => d.v))), n);
  const body = lines.map(l => {
    const pts = l.data.map((d, i) => `${f.x(i).toFixed(1)},${f.y(d.v).toFixed(1)}`).join(' ');
    return `<polygon points="${f.x(0)},${f.y(0)} ${pts} ${f.x(n - 1)},${f.y(0)}" style="fill:${l.c};opacity:.09"/><polyline points="${pts}" fill="none" style="stroke:${l.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
      (n <= 14 ? l.data.map((d, i) => `<circle cx="${f.x(i)}" cy="${f.y(d.v)}" r="3" style="fill:${l.c}"/>`).join('') : '');
  }).join('');
  return `<div class="overflow-x-auto"><svg viewBox="0 0 ${f.W} ${f.H}" style="width:100%;min-width:420px;height:auto" role="img">${f.grid}${xlabels(f, lines[0].data)}${body}</svg></div>${legend(lines.map(l => ({ l: l.l, c: l.c, v: l.data.reduce((s, d) => s + d.v, 0) })))}`;
}
function vbars(data, c) {
  const n = data.length, f = frame(Math.max(1, ...data.map(d => d.v)), n);
  const bw = (f.W - f.pl - f.pr) / n;
  const rects = data.map((d, i) => `<rect x="${f.pl + i * bw + bw * .16}" y="${f.y(d.v)}" width="${bw * .68}" height="${Math.max(0, f.y(0) - f.y(d.v))}" rx="2" style="fill:${c}"><title>${dlab(d.k)}: ${d.v}</title></rect>`).join('');
  return `<div class="overflow-x-auto"><svg viewBox="0 0 ${f.W} ${f.H}" style="width:100%;min-width:420px;height:auto" role="img">${f.grid}${xlabels({ ...f, x: i => f.pl + i * bw + bw / 2 }, data)}${rects}</svg></div>`;
}
function pie(items, hole) {
  items = items.map((i, x) => ({ ...i, c: PAL[x % PAL.length] }));
  const total = items.reduce((s, i) => s + i.v, 0);
  if (!total) return empty('fa-chart-pie', 'No data yet.');
  let off = 0;
  const r = hole ? 14 : 9, sw = hole ? 7 : 18;
  const arcs = items.filter(i => i.v > 0).map(i => {
    const p = i.v / total * 100;
    const c = `<circle cx="18" cy="18" r="${r}" fill="none" pathLength="100" style="stroke:${i.c}" stroke-width="${sw}" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${-off}" transform="rotate(-90 18 18)"><title>${esc(i.l)}: ${i.v}</title></circle>`;
    off += p; return c;
  }).join('');
  const mid = hole ? `<text x="18" y="19.6" text-anchor="middle" style="font-size:6px;font-weight:800;fill:currentColor">${num(total)}</text>` : '';
  return `<div class="flex flex-wrap items-center justify-center gap-6"><svg viewBox="0 0 36 36" style="width:190px;height:190px" role="img">${arcs}${mid}</svg>
    <div class="space-y-1.5 text-sm">${items.map(i => `<div class="flex items-center gap-2"><span style="width:12px;height:12px;border-radius:4px;background:${i.c}"></span><span class="name !font-semibold">${esc(i.l)}</span><span class="meta">${num(i.v)} · ${Math.round(i.v / total * 100)}%</span></div>`).join('')}</div></div>`;
}

function anHtml() {
  const { cards, todo, ev, newUsers, biz } = an;
  const tabs = [['numbers', 'Numbers', 'fa-hashtag'], ['bar', 'Bar', 'fa-chart-column'], ['line', 'Line', 'fa-chart-line'], ['pie', 'Pie', 'fa-chart-pie']];
  const ranges = (anView === 'bar' || anView === 'line') ? `<div class="flex gap-2">${[7, 30].map(d => `<button class="chip ${anDays === d ? 'on' : ''}" data-act="an-days" data-d="${d}">${d} days</button>`).join('')}</div>` : '';
  const head = `<section class="card sec !mt-0"><div class="flex flex-wrap items-center justify-between gap-3"><div class="flex gap-2 overflow-x-auto">${tabs.map(([k, t, i]) => `<button class="chip ${anView === k ? 'on' : ''}" data-act="an-view" data-v="${k}"><i class="fa-solid ${i}"></i> ${t}</button>`).join('')}</div>${ranges}</div></section>`;
  let body;
  if (anView === 'numbers') {
    body = `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mt-3">${cards.map(([l, n, i]) =>
      `<div class="card stat p-4"><div class="ico"><i class="fa-solid ${i}"></i></div><div class="n">${num(n)}</div><div class="l">${l}</div></div>`).join('')}</div>
    <section class="card sec"><h2 class="text-lg font-bold">Needs attention</h2><p class="meta mb-2">Open each page to deal with the items.</p>
      ${todo.map(([l, n, p, i]) => `<a class="row" href="#/${p}"><span class="grow flex items-center gap-3"><span class="ico !mb-0"><i class="fa-solid ${i}"></i></span><span class="name">${l}</span></span>${pill(num(n), Number(n) ? 'warn' : '')}</a>`).join('')}
    </section>`;
  } else if (anView === 'bar') {
    const cats = {}; biz.forEach(b => { const k = b.category || 'Other'; cats[k] = (cats[k] || 0) + 1; });
    const catItems = Object.entries(cats).sort((x, y) => y[1] - x[1]).slice(0, 8).map(([l, v]) => ({ l, v }));
    body = chartCard('Key numbers', 'The main totals side by side.', hbars(cards.map(([l, n]) => ({ l, v: Number(n || 0) })))) +
      chartCard(`Views per day, last ${anDays} days`, '', vbars(daily(ev, r => r.kind === 'view', anDays), PAL[0])) +
      chartCard(`Tier clicks per day, last ${anDays} days`, '', vbars(daily(ev, r => r.kind === 'tier_click', anDays), PAL[1])) +
      chartCard('Listings by category', 'Most used categories first.', hbars(catItems));
  } else if (anView === 'line') {
    body = chartCard('Views and tier clicks', `Daily totals for the last ${anDays} days.`, lineChart([
      { l: 'Views', c: PAL[0], data: daily(ev, r => r.kind === 'view', anDays) },
      { l: 'Tier clicks', c: PAL[2], data: daily(ev, r => r.kind === 'tier_click', anDays) },
    ])) + chartCard('New users', `Sign-ups per day, last ${anDays} days.`, lineChart([{ l: 'New users', c: PAL[3], data: daily(newUsers, () => true, anDays) }]));
  } else {
    const plan = { Pro: 0, Featured: 0, Free: 0 };
    biz.forEach(b => { plan[active(b.pro_until) ? 'Pro' : active(b.featured_until) ? 'Featured' : 'Free']++; });
    const cats = {}; biz.forEach(b => { const k = b.category || 'Other'; cats[k] = (cats[k] || 0) + 1; });
    const sorted = Object.entries(cats).sort((x, y) => y[1] - x[1]);
    const top = sorted.slice(0, 6).map(([l, v]) => ({ l, v })), rest = sorted.slice(6).reduce((n, [, v]) => n + v, 0);
    if (rest) top.push({ l: 'Other', v: rest });
    body = chartCard('Listings by plan', 'How many listings are on each plan.', pie(Object.entries(plan).map(([l, v]) => ({ l, v })))) +
      chartCard('Listings by category', '', pie(top, true)) +
      chartCard('Needs attention', 'Open items for you.', pie(todo.map(([l, n]) => ({ l, v: Number(n || 0) })), true));
  }
  return head + body;
}

  { id: 'deepseek', label: 'DeepSeek', env: 'DEEPSEEK_API_KEY', keyUrl: 'platform.deepseek.com' },

async function pgAI() {
  const { providers: srv } = await fn('status');
  const have = new Set(srv.map(p => String(p.id).toLowerCase()));
  const more = EXTRA_AI.filter(e => !have.has(e.id)).slice(0, 5).map(e => ({ ...e, source: 'none', masked: '', last_status: null, extra: true }));
  const providers = [...srv, ...more];
  const n = k => providers.filter(p => aiState(p) === k).length;
  const stats = [['Connected', n('ok'), 'fa-plug-circle-check'], ['Needs a check', n('check'), 'fa-triangle-exclamation'], ['No key yet', n('none'), 'fa-key']];
  const chips = [['all', 'All ' + providers.length], ['ok', 'Connected'], ['check', 'Needs a check'], ['none', 'No key']];

    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><h2 class="text-lg font-bold">AI assistant API keys</h2>
        <p class="meta">The helper tries models in the order shown (#1 first) and moves on if one fails. Keys are stored on the server, and only the last four characters show here.</p></div>
      <button class="btn" data-act="test-all"><i class="fa-solid fa-plug"></i> Check all</button>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-4">${stats.map(([l, c, i]) => `<div class="card stat p-3" style="box-shadow:none;border:1px solid #eceef2"><div class="n">${c}</div><div class="l"><i class="fa-solid ${i} mr-1"></i>${l}</div></div>`).join('')}</div>
    <div class="flex gap-2 overflow-x-auto mt-4 pb-1">${chips.map(([f, t], i) => `<button class="chip ${i ? '' : 'on'}" data-act="ai-filter" data-f="${f}" data-fchip="1">${t}</button>`).join('')}</div>
  </section>
  <div class="grid md:grid-cols-2 gap-3 mt-3">${providers.map((p, i) => `
    <div class="card p-5 space-y-3" data-state="${aiState(p)}">
      <div class="flex flex-wrap items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2"><span class="pill">#${i + 1}</span><span class="name">${esc(p.label)}</span>${p.extra ? pill('New', 'good') : ''}${keyPill(p)}</div>
          <div class="meta mono mt-1">${p.masked ? esc(p.masked) : 'No key saved'} · ${esc(p.env)}</div>
          <div class="meta">Get a key: ${esc(p.keyUrl)}</div>
          ${p.last_checked ? `<div class="meta">Last checked ${fmt(p.last_checked)}${p.last_error ? ' · ' + esc(p.last_error) : ''}</div>` : ''}
          ${p.extra ? '<div class="meta">New model. The ai-proxy function must also list it before the key can work.</div>' : ''}
        </div>
        ${pill(SRC[p.source][0], SRC[p.source][1])}
      </div>
      <div class="acts">
        <input id="k-${p.id}" type="password" class="input" placeholder="Paste API key" autocomplete="off" style="flex:1 1 220px">
        <button class="btn" data-act="save" data-provider="${p.id}"${p.extra ? ' data-extra="1"' : ''}>Save</button>
        <button class="btn-ghost" data-act="test" data-provider="${p.id}"${p.extra ? ' data-extra="1"' : ''}>Test</button>
        ${p.source === 'saved' ? `<button class="btn-bad" data-act="save" data-provider="${p.id}" data-clear="1">Remove</button>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

  users: { t: 'Users', i: 'fa-users', g: 'People', f: pgUsers },
  ai: { t: 'AI models & keys', i: 'fa-robot', g: 'System', f: pgAI },
  audit: { t: 'Audit logs', i: 'fa-scroll', g: 'System', f: pgAudit },
};

// ============ ACTIONS: every button on the page ============
const ACT = {
  reply: async ({ id }) => {
    const text = ($('r-' + id).value || '').trim();
    if (!text) throw new Error('Type a reply first.');
    await fn('support-reply', { id, text });
    await audit('support.reply', id, text.slice(0, 80));
    toast('Reply sent to the student.'); route();
  },
  close: async ({ id }) => { await fn('support-close', { id }); await audit('support.close', id); toast('Chat closed.'); route(); },
  approve: async ({ id }) => {
    const now = new Date().toISOString();
    const { data, error } = await sb.from('student_verifications').update({ status: 'approved', review_note: null, reviewed_at: now }).eq('user_id', id).select('user_id');
    if (error) throw error;
    if (!data?.length) throw new Error('This ID could not be updated.');
    // The Verified tick goes to listings on an active Pro plan, matching the Pro perks
    await sb.from('businesses').update({ is_verified: true }).eq('owner_id', id).gt('pro_until', now);
    await audit('id.approve', id, 'Student ID approved'); toast('ID approved.'); route();
  },
  reject: async ({ id }) => {
    const note = (prompt('Reason the student will see (at least 5 characters):') || '').trim();
    if (note.length < 5) throw new Error('Write a short reason so the student knows what to fix.');
    const { error } = await sb.from('student_verifications').update({ status: 'rejected', review_note: note, reviewed_at: new Date().toISOString() }).eq('user_id', id);
    if (error) throw error;
    await audit('id.reject', id, note); toast('Rejection sent.'); route();
  },
  'view-id': async ({ path }) => {
    const { data, error } = await sb.storage.from('student-ids').createSignedUrl(path, 120);
    if (error) throw error;
    window.open(data.signedUrl, '_blank', 'noopener');
  },
  publish: async ({ id, value }) => {
    const v = value === 'true';
    const { error } = await sb.from('businesses').update({ is_published: v }).eq('id', id);
    if (error) throw error;
    await audit('listing.publish', id, 'is_published=' + v); toast(v ? 'Listing shown.' : 'Listing hidden.'); route();
  },
  verify: async ({ id, value }) => {
    const v = value === 'true';
    const { error } = await sb.from('businesses').update({ is_verified: v }).eq('id', id);
    if (error) throw error;
    await audit('listing.verify', id, 'is_verified=' + v); toast(v ? 'Tick added.' : 'Tick removed.'); route();
  },
  report: async ({ id, status }) => {
    const { error } = await sb.from('reports').update({ status }).eq('id', id);
    if (error) throw error;
    await audit('report.' + status, id); route();
  },
  promo: async ({ id, kind }) => {
    const { data: b, error: readErr } = await sb.from('businesses').select('owner_id, featured_until, pro_until').eq('id', id).single();
    if (readErr) throw readErr;
    // Extend from the current end date if it is still active, otherwise from now
    const add = (d, n) => new Date((active(d) ? new Date(d) : new Date()).getTime() + n * DAY).toISOString();
    let upd;
    if (kind === 'none') upd = { featured_until: null, pro_until: null };
    else if (kind === 'featured') {
      if (active(b.pro_until)) throw new Error('This listing is on Pro, and Pro replaces Featured.');
      upd = { featured_until: add(b.featured_until, 7) };
    } else if (kind === 'trial') {
      upd = { pro_until: add(b.pro_until, 3), featured_until: null };
      // Mark the trial as used, so the provider cannot start their own free trial afterwards
      await sb.from('profiles').update({ trial_started_at: new Date().toISOString() }).eq('id', b.owner_id).is('trial_started_at', null);
    } else upd = { pro_until: add(b.pro_until, 30), featured_until: null };
    const { error } = await sb.from('businesses').update(upd).eq('id', id);
    if (error) throw error;
    await audit('promo.' + kind, id, JSON.stringify(upd)); toast('Saved.'); route();
  },
  'cat-add': async () => {
    const name = $('cn').value.trim();
    const icon = $('ci').value.trim().replace(/^fa-solid\s+/, '') || 'fa-tag';
    if (!name) throw new Error('Type a category name first.');
    const { data: last } = await sb.from('categories').select('position').order('position', { ascending: false }).limit(1);
    const { error } = await sb.from('categories').insert({ name, icon, position: ((last?.[0]?.position) || 0) + 1 });
    if (error) throw new Error(error.message.includes('duplicate') ? 'That category already exists.' : error.message);
    await audit('category.add', null, name); toast('Category added.'); route();
  },
  'cat-del': async ({ name }) => {
    if (!confirm(`Remove "${name}"? Existing listings keep their category.`)) return;
    const { error } = await sb.from('categories').delete().eq('name', name);
    if (error) throw error;
    await audit('category.remove', null, name); route();
  },
  save: async ({ provider, clear, extra }) => {
    const key = clear ? '' : ($('k-' + provider).value || '').trim();
    if (!clear && !key) throw new Error('Paste a key first.');
    try { await fn('save', { provider, key }); }
    catch (e) { throw new Error(extra ? `ai-proxy does not accept "${provider}" yet. Add it to the function first. (${e.message})` : e.message); }
    await audit('ai.key.' + (clear ? 'remove' : 'save'), provider, clear ? 'Saved key removed' : 'Key replaced');
    toast(clear ? 'Saved key removed.' : 'Key saved. Test it to confirm the connection.'); route();
  },
  test: async ({ provider, extra }) => {
    toast('Checking…');
    let r;
    try { r = await fn('test', { provider }); }
    catch (e) { throw new Error(extra ? `ai-proxy does not know "${provider}" yet. Add it to the function first.` : e.message); }
    toast(r.ok ? `Connected (${r.ms} ms)` : 'Not connected: ' + r.error, r.ok ? 'ok' : 'bad'); route();
  },
  'test-all': async () => {
    toast('Checking all providers…');
    const { results } = await fn('test-all');
    const n = results.filter(r => r.ok).length;
    toast(`${n} of ${results.length} connected.`, n ? 'ok' : 'bad'); route();
  },
};

// ============ AI AGENT AND EMAIL TEMPLATES ============
const TEMPLATES = {
  welcome: ['Welcome to UBEN Link', 'Hi {name}, welcome to UBEN Link. Find services from fellow students, or list your own. The UBEN helper can answer questions any time from the menu.'],
  id_ok: ['Your student ID is approved', 'Hi {name}, your student ID has been approved. You can now list your service. Pro listings also get the Verified tick.'],
  id_no: ['Your student ID needs a change', 'Hi {name}, we could not approve your student ID. Reason: {detail}. Please upload a clearer photo in Profile.'],
  finish: ['Finish your listing', 'Hi {name}, your listing {business} is still missing a few things. Add a phone number, a description, a photo and a price so students can find you.'],
  pro_end: ['Plan update: Pro has ended', 'Your Pro plan for {business} has ended, so the listing is back on the free plan. You can renew any time from Subscription.'],
  plan_on: ['Plan update: your plan is active', 'Thank you, {name}. Your plan for {business} is now active for 30 days.'],
  ai_news: ['New: the UBEN helper and assistant', 'Hi {name}, the UBEN helper is in the menu and answers questions on every plan. Pro listings can also let it book, edit and pin for them, and it always asks you to confirm first.'],
  notice: ['Notice from UBEN Link', 'Hi {name}, {detail}'],
};

function tplFill(key) {
  const [subject, body] = TEMPLATES[key];
  const vars = { name: $('tplName').value.trim() || 'there', business: $('tplBiz').value.trim(), detail: $('tplDetail').value.trim() };
  const fill = t => t.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  return [fill(subject), fill(body)];
}
function previewTpl() {
  if (!$('tplPick')) return;
  const [subject, body] = tplFill($('tplPick').value);
  $('tplSubj').textContent = subject;
  $('tplBody').textContent = body;
}
async function tplRecipients(aud) {
  if (aud === 'pending') {
    const { data } = await sb.from('student_verifications').select('user_id').eq('status', 'pending');
    return [...new Set((data || []).map(r => r.user_id))];
  }
  if (aud === 'providers' || aud === 'pro') {
    const { data } = await sb.from('businesses').select('owner_id, pro_until');
    return [...new Set((data || []).filter(b => aud === 'providers' || active(b.pro_until)).map(b => b.owner_id))];
  }
  const { data } = await sb.from('profiles').select('id');
  return (data || []).map(p => p.id);
}
async function tplEmails(ids) {
  const wanted = new Set(ids);
  const { data } = await sb.from('profiles').select('id, email');
  return (data || []).filter(p => wanted.has(p.id) && p.email).map(p => p.email);
}

async function pgAgent() {
  await sb.rpc('agent_run_now', { force: false }); // runs at most every 20 minutes
  const { data, error } = await sb.from('agent_log').select('id, created_at, task, summary, needs_human, resolved')
    .order('created_at', { ascending: false }).limit(150);
  if (error) throw error;
  const open = (data || []).filter(l => l.needs_human && !l.resolved);
  const badge = document.querySelector('[data-badge="agent"]');
  if (badge) badge.innerHTML = open.length ? pill(open.length, 'warn') : '';
  return `<section class="card sec">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><h2 class="text-lg font-bold">AI agent</h2>
        <p class="meta">It handles routine admin work on its own and logs every change below. It only messages you about things that need a person, and those also appear under Needs you.</p></div>
      <button class="btn" data-act="agent-run"><i class="fa-solid fa-rotate"></i> Run now</button>
    </div></section>
    ${sec('Needs you', 'Handle these, then tap Mark done.', open.map(l => item(l.summary,
      `<div class="name">${esc(l.summary)}</div><div class="meta">${fmt(l.created_at)}</div>`,
      `<button class="btn-ghost" data-act="agent-done" data-id="${l.id}">Mark done</button>`)).join(''), 'fa-circle-check', 'Nothing needs you right now.')}
    ${sec('What the agent did', 'Newest first.', (data || []).filter(l => !(l.needs_human && !l.resolved)).map(l => item(l.summary,
      `<div class="meta">${fmt(l.created_at)} · ${esc(l.task)}</div><div class="text-sm text-gray-700">${esc(l.summary)}</div>`)).join(''),
      'fa-user-gear', 'The agent has not changed anything yet.', search('Search activity'))}`;
}

async function pgTemplates() {
  setTimeout(previewTpl, 0);
  return `<section class="card sec">
    <h2 class="text-lg font-bold">Email templates</h2>
    <p class="meta mb-3">Pick a template and fill in the blanks. Send it in the app, or open it in your email app to send from there.</p>
    <div class="grid md:grid-cols-2 gap-3">
      <div><label class="lbl">Template</label><select id="tplPick" class="input">${Object.entries(TEMPLATES).map(([k, t]) => `<option value="${k}">${esc(t[0])}</option>`).join('')}</select></div>
      <div><label class="lbl">Who gets it</label><select id="tplAud" class="input">
        <option value="all">Everyone with an account</option>
        <option value="providers">Everyone with a listing</option>
        <option value="pro">Pro providers</option>
        <option value="pending">Students with an ID waiting</option>
      </select></div>
      <div><label class="lbl">Name (fills {name})</label><input id="tplName" class="input" placeholder="Leave blank to say there"></div>
      <div><label class="lbl">Business (fills {business})</label><input id="tplBiz" class="input" placeholder="e.g. Code X"></div>
      <div class="md:col-span-2"><label class="lbl">Reason or message (fills {detail})</label><input id="tplDetail" class="input" placeholder="e.g. the photo is blurry"></div>
    </div>
    <div class="card p-4 mt-4" style="box-shadow:none;background:#f9fafb"><div class="name" id="tplSubj"></div><div class="text-sm text-gray-700 mt-2 whitespace-pre-wrap" id="tplBody"></div></div>
    <div class="acts mt-3">
      <button class="btn" data-act="tpl-send"><i class="fa-solid fa-paper-plane"></i> Send in app</button>
      <button class="btn-ghost" data-act="tpl-mail"><i class="fa-regular fa-envelope"></i> Open in email app</button>
      <button class="btn-ghost" data-act="tpl-copy">Copy emails</button>
    </div>
  </section>`;
}

Object.assign(ACT, {
  'an-view': async ({ v }) => { anView = v; $('main').innerHTML = anHtml(); },
  'an-days': async ({ d }) => { anDays = Number(d); $('main').innerHTML = anHtml(); },
  'ai-filter': async ({ f }) => {
    document.querySelectorAll('[data-fchip]').forEach(c => c.classList.toggle('on', c.dataset.f === f));
    document.querySelectorAll('#main [data-state]').forEach(c => { c.hidden = f !== 'all' && c.dataset.state !== f; });
  },
  'agent-run': async () => {
    const r = await sb.rpc('agent_run_now', { force: true });
    if (r.error) throw r.error;
    toast(`Agent finished. ${r.data ?? 0} change(s).`); route();
  },
  'agent-done': async ({ id }) => {
    const { error } = await sb.from('agent_log').update({ resolved: true, resolved_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    toast('Marked done.'); route();
  },
  'tpl-send': async () => {
    const [subject, body] = tplFill($('tplPick').value);
    const ids = await tplRecipients($('tplAud').value);
    if (!ids.length) throw new Error('No one matches that audience.');
    if (!confirm(`Send "${subject}" to ${ids.length} people in the app?`)) return;
    for (let i = 0; i < ids.length; i += 200) {
      const { error } = await sb.from('admin_messages').insert(ids.slice(i, i + 200).map(id => ({ recipient_id: id, subject, body })));
      if (error) throw error;
    }
    await audit('email.template', null, `${$('tplPick').value} to ${$('tplAud').value} (${ids.length})`);
    toast(`Sent to ${ids.length} people.`); route();
  },
  'tpl-mail': async () => {
    const [subject, body] = tplFill($('tplPick').value);
    const emails = await tplEmails(await tplRecipients($('tplAud').value));
    if (!emails.length) throw new Error('No email addresses for that audience.');
    location.href = 'mailto:?bcc=' + encodeURIComponent(emails.slice(0, 40).join(',')) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    if (emails.length > 40) toast(`Opened the first 40 of ${emails.length}. Use Copy emails for the rest.`);
  },
  'tpl-copy': async () => {
    const emails = await tplEmails(await tplRecipients($('tplAud').value));
    try { await navigator.clipboard.writeText(emails.join(', ')); toast(`${emails.length} emails copied.`); }
    catch (_) { throw new Error('Could not copy. Select the list in your email app instead.'); }
  },
});

Object.assign(PAGES, {
  agent: { t: 'AI agent', i: 'fa-user-gear', g: 'Overview', f: pgAgent },
  templates: { t: 'Email templates', i: 'fa-envelope', g: 'People', f: pgTemplates },
});

$('main').addEventListener('input', e => { if (['tplName', 'tplBiz', 'tplDetail'].includes(e.target.id)) previewTpl(); });
$('main').addEventListener('change', e => { if (e.target.id === 'tplPick' || e.target.id === 'tplAud') previewTpl(); });

// ============ ROUTER AND SHELL ============
const GROUPS = { Overview: 'fa-gauge-high', Providers: 'fa-store', Content: 'fa-layer-group', People: 'fa-users', System: 'fa-gear' };
function shutGroups() { try { return JSON.parse(localStorage.getItem('uw_nav_shut') || '[]'); } catch (_) { return []; } }
function buildNav() {
  const shut = shutGroups();
  $('nav').innerHTML = Object.entries(GROUPS).map(([g, gi]) => {
    const closed = shut.includes(g);
    const links = Object.entries(PAGES).filter(([, p]) => p.g === g).map(([k, p]) =>
      `<a class="navitem" href="#/${k}" data-nav="${k}"><i class="fa-solid ${p.i}"></i><span class="flex-1">${p.t}</span><span data-badge="${k}"></span></a>`).join('');
    return `<div><button type="button" class="grp" data-grp="${g}" aria-expanded="${!closed}"><span><i class="fa-solid ${gi} mr-2"></i>${g}</span><i class="fa-solid fa-chevron-down text-[10px]" style="transition:transform .15s;${closed ? 'transform:rotate(-90deg)' : ''}"></i></button><div class="nbody" ${closed ? 'hidden' : ''}>${links}</div></div>`;
  }).join('');
}
$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-grp]'); if (!b) return;
  const body = b.nextElementSibling, shut = body.hidden;
  body.hidden = !shut; b.setAttribute('aria-expanded', shut);
  b.lastElementChild.style.transform = shut ? '' : 'rotate(-90deg)';
  const list = shutGroups().filter(x => x !== b.dataset.grp); if (!shut) list.push(b.dataset.grp);
  try { localStorage.setItem('uw_nav_shut', JSON.stringify(list)); } catch (_) {}
});

async function route() {
  if (!me) return;
  const k = location.hash.slice(2);
  const key = Object.prototype.hasOwnProperty.call(PAGES, k) ? k : 'analytics';
  const my = ++rid;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === key));
  $('title').textContent = PAGES[key].g + ' › ' + PAGES[key].t;
  document.querySelector(`[data-nav="${key}"]`)?.closest('.nbody')?.removeAttribute('hidden');
  drawer(false);
  $('main').innerHTML = '<div class="grid gap-3"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  let html;
  try { html = await PAGES[key].f(); }
  catch (e) { html = `<div class="card p-6 text-red-600">${esc(e.message || e)}</div>`; }
  if (my === rid) $('main').innerHTML = html; // ignore a page the admin has already left
}

// One handler for every button, so redrawing a page never loses it
$('main').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  el.disabled = true;
  try { await ACT[el.dataset.act](el.dataset); }
  catch (err) { toast(err.message || 'Something went wrong.', 'bad'); }
  finally { el.disabled = false; }
});
// Live search for every list
$('main').addEventListener('input', e => {
  if (!e.target.matches('[data-search]')) return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#main [data-q]').forEach(r => { r.hidden = !r.dataset.q.includes(q); });
});

const ACCENTS = { plum: ['Plum', '#4b1049'], ocean: ['Ocean', '#0b4f8a'], forest: ['Forest', '#14653f'], sunset: ['Sunset', '#c2410c'] };
function markAccent() {
  const cur = document.documentElement.dataset.accent || 'plum';
  document.querySelectorAll('[data-accent-pick]').forEach(b => { const on = b.dataset.accentPick === cur; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
function setAccent(k, save = true) {
  if (!ACCENTS[k]) k = 'plum';
  document.documentElement.dataset.accent = k;
  if (save) { try { localStorage.setItem('uw_accent', k); } catch (_) {} }
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', ACCENTS[k][1]);
  markAccent();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-accent-pick]'); if (b) setAccent(b.dataset.accentPick); });

$('menu').onclick = () => drawer(!$('drawer').classList.contains('open'));
$('scrim').onclick = () => drawer(false);
$('dark').onclick = () => setDark(!document.documentElement.classList.contains('dark'));
setDark(localStorage.getItem('uw_dark') === '1');

// ============ SIGN IN ============
$('lf').onsubmit = async e => {
  e.preventDefault();
  $('lmsg').textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('le').value.trim(), password: $('lp').value });
  if (error) { $('lmsg').textContent = error.message; return; }
  enter(data.user);
};
$('logout').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { me = null; $('app').hidden = true; $('login').hidden = false; } });

async function enter(user) {
  // This only hides the page from other accounts. Row Level Security is the real protection.
  if ((user.email || '').toLowerCase() !== ADMIN) {
    await sb.auth.signOut();
    $('lmsg').textContent = 'This account is not an admin.';
    return;
  }
  me = user;
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = user.email;
  buildNav();
  if (!location.hash) location.hash = '#/analytics';
  route();
  badgeCount();
}
window.addEventListener('hashchange', route);
setInterval(() => { if (me) badgeCount(); }, 60000);
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(data.session.user);
  else $('login').hidden = false;
})();
</script>
