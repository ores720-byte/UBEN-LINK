// ============ PAGES: each returns HTML ============
let an = null, anView = 'numbers', anDays = 30;
const PAL = ['rgb(var(--ac))', '#0ea5e9', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#64748b', '#ec4899'];
const num = n => Number(n || 0).toLocaleString('en-NG');
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
async function allRows(build) {
  let all = [];
  for (let from = 0; from < 10000; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    all = all.concat(data || []);
    if ((data || []).length < 1000) break;
  }
  return all;
}
function daily(rows, test, n) {
  const keys = Array.from({ length: n }, (_, i) => dayKey(Date.now() - (n - 1 - i) * DAY));
  const m = Object.fromEntries(keys.map(k => [k, 0]));
  rows.forEach(r => { if (test(r)) { const k = dayKey(r.created_at); if (k in m) m[k]++; } });
  return keys.map(k => ({ k, v: m[k] }));
}
const dlab = k => new Date(k + 'T00:00').toLocaleDateString('en-NG', { day: 'numeric', month: 'short' });
const legend = items => `<div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs meta">${items.map(i => `<span class="inline-flex items-center gap-1.5"><span style="width:10px;height:10px;border-radius:3px;background:${i.c}"></span>${esc(i.l)}${i.v != null ? ' · ' + num(i.v) : ''}</span>`).join('')}</div>`;
const chartCard = (t, s, body) => `<section class="card sec"><h2 class="text-lg font-bold">${t}</h2>${s ? `<p class="meta mb-3">${s}</p>` : ''}${body}</section>`;
const axisTxt = 'fill:#9ca3af;font-size:10px';

function hbars(items) {
  if (!items.length) return empty('fa-chart-simple', 'No data yet.');
  const max = Math.max(1, ...items.map(i => i.v));
  return `<div class="space-y-3">${items.map((i, x) => `<div><div class="flex justify-between gap-3 text-sm mb-1"><span class="name truncate">${esc(i.l)}</span><span class="meta">${num(i.v)}</span></div><div style="height:10px;border-radius:999px;background:rgba(148,163,184,.22)"><div style="height:100%;width:${Math.max(2, i.v / max * 100)}%;border-radius:999px;background:${PAL[x % PAL.length]}"></div></div></div>`).join('')}</div>`;
}
function frame(max, n) {
  const W = 600, H = 230, pl = 34, pr = 10, pt = 12, pb = 26;
  const x = i => pl + (n > 1 ? i * (W - pl - pr) / (n - 1) : (W - pl - pr) / 2);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const grid = [0, .5, 1].map(t => Math.round(max * t)).map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(148,163,184,.3)"/><text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end" style="${axisTxt}">${t}</text>`).join('');
  return { W, H, pl, pr, x, y, grid };
}
function xlabels(f, data) {
  const n = data.length;
  return [0, Math.floor((n - 1) / 2), n - 1].map(i => `<text x="${f.x(i)}" y="${f.H - 6}" text-anchor="middle" style="${axisTxt}">${dlab(data[i].k)}</text>`).join('');
}
function lineChart(lines) {
  const n = lines[0].data.length;
  const f = frame(Math.max(1, ...lines.flatMap(l => l.data.map(d => d.v))), n);
  const body = lines.map(l => {
    const pts = l.data.map((d, i) => `${f.x(i).toFixed(1)},${f.y(d.v).toFixed(1)}`).join(' ');
    return `<polygon points="${f.x(0)},${f.y(0)} ${pts} ${f.x(n - 1)},${f.y(0)}" style="fill:${l.c};opacity:.09"/><polyline points="${pts}" fill="none" style="stroke:${l.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
      (n <= 14 ? l.data.map((d, i) => `<circle cx="${f.x(i)}" cy="${f.y(d.v)}" r="3" style="fill:${l.c}"/>`).join('') : '');
  }).join('');
  return `<div class="overflow-x-auto"><svg viewBox="0 0 ${f.W} ${f.H}" style="width:100%;min-width:420px;height:auto" role="img">${f.grid}${xlabels(f, lines[0].data)}${body}</svg></div>${legend(lines.map(l => ({ l: l.l, c: l.c, v: l.data.reduce((s, d) => s + d.v, 0) })))}`;
}
function vbars(data, c) {
  const n = data.length, f = frame(Math.max(1, ...data.map(d => d.v)), n);
  const bw = (f.W - f.pl - f.pr) / n;
  const rects = data.map((d, i) => `<rect x="${f.pl + i * bw + bw * .16}" y="${f.y(d.v)}" width="${bw * .68}" height="${Math.max(0, f.y(0) - f.y(d.v))}" rx="2" style="fill:${c}"><title>${dlab(d.k)}: ${d.v}</title></rect>`).join('');
  return `<div class="overflow-x-auto"><svg viewBox="0 0 ${f.W} ${f.H}" style="width:100%;min-width:420px;height:auto" role="img">${f.grid}${xlabels({ ...f, x: i => f.pl + i * bw + bw / 2 }, data)}${rects}</svg></div>`;
}
function pie(items, hole) {
  items = items.map((i, x) => ({ ...i, c: PAL[x % PAL.length] }));
  const total = items.reduce((s, i) => s + i.v, 0);
  if (!total) return empty('fa-chart-pie', 'No data yet.');
  let off = 0;
  const r = hole ? 14 : 9, sw = hole ? 7 : 18;
  const arcs = items.filter(i => i.v > 0).map(i => {
    const p = i.v / total * 100;
    const c = `<circle cx="18" cy="18" r="${r}" fill="none" pathLength="100" style="stroke:${i.c}" stroke-width="${sw}" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${-off}" transform="rotate(-90 18 18)"><title>${esc(i.l)}: ${i.v}</title></circle>`;
    off += p; return c;
  }).join('');
  const mid = hole ? `<text x="18" y="19.6" text-anchor="middle" style="font-size:6px;font-weight:800;fill:currentColor">${num(total)}</text>` : '';
  return `<div class="flex flex-wrap items-center justify-center gap-6"><svg viewBox="0 0 36 36" style="width:190px;height:190px" role="img">${arcs}${mid}</svg>
    <div class="space-y-1.5 text-sm">${items.map(i => `<div class="flex items-center gap-2"><span style="width:12px;height:12px;border-radius:4px;background:${i.c}"></span><span class="name !font-semibold">${esc(i.l)}</span><span class="meta">${num(i.v)} · ${Math.round(i.v / total * 100)}%</span></div>`).join('')}</div></div>`;
}

    body = chartCard('Key numbers', 'The main totals side by side.', hbars(cards.map(([l, n]) => ({ l, v: Number(n || 0) })))) +

      chartCard(`Tier clicks per day, last ${anDays} days`, '', vbars(daily(ev, r => r.kind === 'tier_click', anDays), PAL[1])) +
      chartCard('Listings by category', 'Most used categories first.', hbars(catItems));
  } else if (anView === 'line') {
    body = chartCard('Views and tier clicks', `Daily totals for the last ${anDays} days.`, lineChart([
      { l: 'Views', c: PAL[0], data: daily(ev, r => r.kind === 'view', anDays) },
      { l: 'Tier clicks', c: PAL[2], data: daily(ev, r => r.kind === 'tier_click', anDays) },
    ])) + chartCard('New users', `Sign-ups per day, last ${anDays} days.`, lineChart([{ l: 'New users', c: PAL[3], data: daily(newUsers, () => true, anDays) }]));
  } else {
    const plan = { Pro: 0, Featured: 0, Free: 0 };
    biz.forEach(b => { plan[active(b.pro_until) ? 'Pro' : active(b.featured_until) ? 'Featured' : 'Free']++; });
    const cats = {}; biz.forEach(b => { const k = b.category || 'Other'; cats[k] = (cats[k] || 0) + 1; });
    const sorted = Object.entries(cats).sort((x, y) => y[1] - x[1]);
    const top = sorted.slice(0, 6).map(([l, v]) => ({ l, v })), rest = sorted.slice(6).reduce((n, [, v]) => n + v, 0);

      chartCard('Listings by category', '', pie(top, true)) +
      chartCard('Needs attention', 'Open items for you.', pie(todo.map(([l, n]) => ({ l, v: Number(n || 0) })), true));
  }
  return head + body;
}

  const chips = `<div class="vfilters">${V_TABS.map(([k, t]) =>
    `<button class="vchip${k === vFilter ? ' on' : ''}" data-act="vFilter" data-f="${k}">${t}</button>`).join('')}</div>`;

  const cards = (data || []).map(v => {
    const f = v.form_data || {}, name = f.full_name || 'No name';
    const when = v.status === 'draft' ? 'Last saved ' + fmt(v.updated_at) : 'Submitted ' + fmt(v.submitted_at);
    return `<div class="vcard" data-q="${esc(`${name} ${f.phone || ''} ${f.trade || ''} ${f.zone || ''}`.toLowerCase())}">
      <span class="vav">${vInitial(name)}</span>
      <div class="grow min-w-0">
        <div class="name">${esc(name)}</div>
        <div class="meta">${esc(vOr(f.trade, 'No trade'))} · ${esc(vOr(f.zone, 'No zone'))}</div>
        <div class="meta">${when}</div>
      </div>
      <div class="vcard-end">${statusPill(v.status)}<button class="btn-ghost" data-act="vOpen" data-id="${esc(v.id)}">Review</button></div>
    </div>`;
  }).join('');

  return chips + search('Search by name, phone, trade or zone') +
    (cards ? `<div class="vgrid">${cards}</div>` : empty('fa-id-card', 'Nothing in this list.'));
}

// Verified providers with their login codes, banned status and re-verification dates.
async function vCodes() {
  // Verified providers who asked for a new code. Issuing a code, or dismissing, closes the request.
  const { data: reqs, error: reqErr } = await sb.rpc('list_code_requests');
  const reqRows = (reqs || []).map(r => item(r.email,
    `<div class="name">${esc(r.email)}</div><div class="meta">Requested ${fmt(r.created_at)}</div>`,
    `<button class="btn-bad" data-act="vReissue" data-user="${esc(r.user_id)}"><i class="fa-solid fa-rotate"></i> Issue new code</button>` +
    `<button class="btn-ghost" data-act="vDismissRequest" data-id="${esc(r.id)}">Dismiss</button>`)).join('');
  const reqBlock = reqErr
    ? `<div class="meta text-red-600 mb-3">Could not load code requests: ${esc(reqErr.message)}</div>`
    : sec('Code requests', 'Verified providers who lost their login code.', reqRows, 'fa-key', 'No code requests.');

  const { data: apps, error } = await sb.from('verifications')
    .select('id, user_id, form_data, reviewed_at').eq('status', 'approved')
    .order('reviewed_at', { ascending: false }).limit(300);
  if (error) throw error;
  const ids = (apps || []).map(a => a.user_id);
  const [codesR, adminR] = ids.length ? await Promise.all([
    sb.from('verification_codes').select('user_id, code, issued_at').in('user_id', ids),
    sb.from('provider_admin').select('user_id, banned, reverify_due, suspended_until, suspend_reason').in('user_id', ids),
  ]) : [{ data: [] }, { data: [] }];
  const byCode = Object.fromEntries((codesR.data || []).map(c => [c.user_id, c]));
  const byAdmin = Object.fromEntries((adminR.data || []).map(c => [c.user_id, c]));
  const today = new Date().toISOString().slice(0, 10);

  const find = `<div class="vfind">
      <input id="vFindCode" class="input" maxlength="40" autocomplete="off" placeholder="Paste a login code to find the provider">
      <button class="btn" data-act="vFind"><i class="fa-solid fa-magnifying-glass"></i> Find</button>
    </div>`;
  const tools = `<div class="flex flex-wrap items-center gap-3 mb-2">
      <label class="meta flex items-center gap-2"><input id="vExportCodes" type="checkbox"> Include codes</label>
      <button class="btn-ghost" data-act="vExpireDue"><i class="fa-solid fa-rotate"></i> Check re-verification dates</button>
      <button class="btn-ghost" data-act="vExport"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
    </div>`;

  const cards = (apps || []).map(a => {
    const f = a.form_data || {}, c = byCode[a.user_id], ad = byAdmin[a.user_id] || {};
    const name = f.full_name || 'No name';
    const due = ad.reverify_due
      ? (ad.reverify_due < today ? pill('Re-verify overdue: ' + ad.reverify_due, 'bad') : pill('Re-verify by ' + ad.reverify_due, 'warn'))
      : '';
    const codeTag = c
      ? `<code class="vcode-inline">${esc(c.code)}</code>
         <button class="btn-ghost" data-act="vCopy" data-code="${esc(c.code)}">Copy</button>`
      : pill('No code saved', 'bad');
    return `<div class="vcard" data-q="${esc(`${name} ${f.phone || ''} ${f.trade || ''} ${f.zone || ''}`.toLowerCase())}">
      <span class="vav">${vInitial(name)}</span>
      <div class="grow min-w-0">
        <div class="flex flex-wrap items-center gap-2"><span class="name">${esc(name)}</span>${codeTag}${ad.banned ? pill('Banned', 'bad') : ''}${(ad.suspended_until && ad.suspended_until >= today) ? pill('Suspended until ' + ad.suspended_until, 'bad') : ''}</div>
        <div class="meta">${esc(vOr(f.trade, ''))} · ${esc(vOr(f.zone, ''))} · ${esc(vOr(f.phone, ''))}</div>
        <div class="flex flex-wrap gap-2 mt-1">${due}</div>
      </div>
      <div class="vcard-end">${(ad.suspended_until && ad.suspended_until >= today)
          ? `<button class="btn-ghost" data-act="vLiftSuspend" data-user="${esc(a.user_id)}">Lift suspension</button>`
          : `<button class="btn-ghost" data-act="vSuspend" data-user="${esc(a.user_id)}"><i class="fa-solid fa-pause"></i> Suspend</button>`}
        <button class="btn-ghost" data-act="vFile" data-user="${esc(a.user_id)}">Open file</button>
        <button class="btn-bad" data-act="vRevoke" data-id="${esc(a.id)}" data-user="${esc(a.user_id)}"><i class="fa-solid fa-user-slash"></i> Remove verification</button></div>
    </div>`;
  }).join('');

  return `<div data-vcodes>${reqBlock}${find}${tools}${search('Search verified providers by name, phone or zone')}` +
    (cards ? `<div class="vgrid">${cards}</div>` : empty('fa-shield-halved', 'No verified providers yet.')) + `</div>`;
}

// Full application for one submission
async function vReview() {
  const { data: v, error } = await sb.from('verifications').select('*').eq('id', vCurrent).single();
  if (error) throw error;
  const f = v.form_data || {}, files = v.files || {};
  const name = f.full_name || 'No name';

  const photo = async (p, bucket, label) => {
    const u = await vSigned(p, bucket);
    return u
      ? `<a href="${u}" target="_blank" rel="noopener" class="vphoto"><img src="${u}" alt="${label}"><span>${label}</span></a>`
      : `<div class="vphoto missing"><i class="fa-solid fa-circle-exclamation"></i><span>${label} missing</span></div>`;
  };
  const [pp, sid, sfie] = await Promise.all([
    photo(files.profile_photo, V_BUCKET, 'Profile photo'),
    photo(files.student_id, 'student-ids', 'Student ID'),
    photo(files.selfie, V_BUCKET, 'Selfie'),
  ]);

  const samples = (await Promise.all((files.samples || []).map(p => vSigned(p)))).filter(Boolean);
  const samplesHtml = samples.length
    ? `<div class="vsamples">${samples.map(u => `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Sample work"></a>`).join('')}</div>`
    : '<p class="meta">No sample work uploaded.</p>';

  const kv = (k, val) => `<div><dt>${k}</dt><dd>${esc(vOr(val))}</dd></div>`;
  const refs = (f.references || []).map(r =>
    `<div class="vref"><b>${esc(r.name || '')}</b><span>${esc(r.phone || '')}</span>${r.relationship ? `<span>${esc(r.relationship)}</span>` : ''}</div>`).join('')
    || '<p class="meta">No references.</p>';
  const intl = vLocalPhone(f.phone);
  const links = intl ? `<div class="vlinks">
      <a class="btn-ghost" href="tel:+234${intl}"><i class="fa-solid fa-phone"></i> Call</a>
      <a class="btn-ghost" target="_blank" rel="noopener" href="https://wa.me/234${intl}"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a></div>` : '';

  const details = `
    <h3>Contact</h3>
    <dl>${kv('Phone', f.phone)}${kv('Email', f.email)}${kv('Preferred contact', f.contact_method)}${kv('Home or workshop', f.address)}</dl>
    ${links}
    <h3>Services</h3>
    <dl>${kv('Trade', f.trade === 'Other' ? f.trade_other : f.trade)}${kv('Years of experience', f.years)}</dl>
    <p class="vdesc">${esc(vOr(f.description, ''))}</p>
    <h3>Location and availability</h3>
    <dl>${kv('Campus zone', f.zone)}${kv('Working days', (f.working_days || []).join(', '))}${kv('Working hours', f.working_hours)}</dl>
    <h3>References</h3>${refs}`;

  // A verified provider's saved code, so it can be checked during a complaint
  let savedCode = null;
  if (v.status === 'approved') {
    const r = await sb.from('verification_codes').select('code').eq('user_id', v.user_id).maybeSingle();
    savedCode = r.data?.code || null;
  }
  const shownCode = vIssued || savedCode;
  const codeBox = shownCode ? `<div class="vcode">
      <div><div class="meta">Login code</div><div class="vcode-val">${esc(shownCode)}</div></div>
      <button class="btn" data-act="vCopy" data-code="${esc(shownCode)}"><i class="fa-regular fa-copy"></i> Copy</button>
    </div>` : '';

  let decision;
  if (v.status === 'pending') {
    decision = `<div class="vdecide">
      <div>
        <h3>Approve</h3>
        <p class="meta mb-2">This creates a login code and replaces the provider's password.</p>
        <input id="vNote" class="input mb-2" maxlength="200" placeholder="Note for your records (optional)">
        <button class="btn w-full" data-act="vApprove"><i class="fa-solid fa-check"></i> Approve and create code</button>
      </div>
      <div>
        <h3>Reject</h3>
        <div class="vfilters">${V_REASONS.map(r =>
          `<button type="button" class="vchip" data-act="vReasonPick" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
        <textarea id="vReason" rows="3" class="input mb-2" maxlength="300" placeholder="Reason the provider will see"></textarea>
        <button class="btn-bad w-full" data-act="vReject"><i class="fa-solid fa-xmark"></i> Reject</button>
      </div>
    </div>`;
  } else {
    decision = `<div class="vstatus">${statusPill(v.status)}<span class="meta">${v.reviewed_at ? 'Decided ' + fmt(v.reviewed_at) : ''}</span></div>`;
  }

  return `
    <button class="btn-ghost mb-3" data-act="vClose"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <div class="vhead">
      <span class="vav lg">${vInitial(name)}</span>
      <div class="grow min-w-0">
        <h2 class="text-xl font-bold">${esc(name)}</h2>
        <div class="meta">${esc(vOr(f.trade, ''))} · Submitted ${fmt(v.submitted_at)}</div>
      </div>
      ${statusPill(v.status)}
    </div>
    ${codeBox}
    ${v.status === 'rejected' && v.rejection_reason ? `<div class="vnote bad"><b>Reason sent:</b> ${esc(v.rejection_reason)}</div>` : ''}
    <div class="vsplit">
      <section class="card sec">
        <h3>Documents</h3>
        <div class="vphotos">${pp}${sid}${sfie}</div>
        <h3>Sample work</h3>${samplesHtml}
      </section>
      <section class="card sec">${details}</section>
    </div>
    ${decision}`;
}

// Everything about one provider: login code, ban, complaints, listings, activity, notes and dates
async function vPersonFile() {
  const uid = vPerson;
  const ok = r => { if (r.error) throw r.error; return r.data; };
  const [prof, app, codeR, adminR, bizR] = await Promise.all([
    sb.from('profiles').select('id, full_name, email, created_at, last_login').eq('id', uid).maybeSingle(),
    sb.from('verifications').select('id, status, form_data, submitted_at, reviewed_at, rejection_reason').eq('user_id', uid).maybeSingle(),
    sb.from('verification_codes').select('code, issued_at').eq('user_id', uid).maybeSingle(),
    sb.from('provider_admin').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('businesses').select('id, name, category, is_published, is_verified, pro_until').eq('owner_id', uid),
  ].map(q => q));
  const p = ok(prof) || {}, a = ok(app), code = ok(codeR), ad = ok(adminR) || {}, biz = ok(bizR) || [];
  const f = a?.form_data || {};
  const bizIds = biz.map(b => b.id);
  const orFilter = `reported_id.eq.${uid}` + (bizIds.length ? `,business_id.in.(${bizIds.join(',')})` : '');

  const dueHtml = ad.reverify_due

         <div class="flex gap-2 flex-wrap">

           <button class="btn-ghost" data-act="vCopy" data-code="${esc(code.code)}">Copy</button>
         </div></div>`
      : '<p class="meta mb-2">No login code yet. It is created when the application is approved.</p>'}
    ${a?.status === 'approved' && !ad.banned
      ? `<button class="btn-bad" data-act="vReissue" data-user="${esc(uid)}"><i class="fa-solid fa-rotate"></i> Reissue code</button>
         <p class="meta mt-2">Their old code and password stop working straight away.</p>` : ''}
  </section>`;

  const banCard = `<section class="card sec"><h3>Account</h3>
    <div class="flex flex-wrap gap-2 mb-2">${ad.banned ? pill('Banned', 'bad') : pill('Active', 'good')} ${dueHtml}</div>
    ${ad.banned
      ? `<p class="meta mb-2">Banned ${fmt(ad.banned_at)}. Reason: ${esc(ad.ban_reason || '')}</p>
         <button class="btn" data-act="vUnban" data-user="${esc(uid)}">Lift ban</button>`
      : `<p class="meta mb-2">A ban stops sign-in and hides their listings. Lifting it restores both.</p>
         <textarea id="vBanReason" rows="2" class="input mb-2" maxlength="300" placeholder="Reason for the ban, for your records"></textarea>
         <button class="btn-bad" data-act="vBan" data-user="${esc(uid)}"><i class="fa-solid fa-ban"></i> Ban provider</button>`}
    <h3>Re-verification</h3>

  const bizHtml = biz.length ? biz.map(b => `<div class="pfile-row"><div><b>${esc(b.name)}</b><div class="meta">${esc(b.category || '')}</div></div>
      <span class="meta">${b.is_published ? pill('Published', 'good') : pill('Hidden', 'warn')} ${b.is_verified ? pill('Verified', 'good') : ''}</span></div>`).join('')

        <div><dt>Zone</dt><dd>${esc(vOr(f.zone))}</dd></div>

  return `

    <div class="vhead">
      <span class="vav lg">${vInitial(name)}</span>
      <div class="grow min-w-0">
        <h2 class="text-xl font-bold">${esc(name)}</h2>
        <div class="meta">${esc(p.email || f.email || '')} · Joined ${fmt(p.created_at)} · Last login ${fmt(p.last_login)}</div>
      </div>
    </div>
    <div class="pfile-grid">
      <div>${codeCard}${banCard}</div>
      <div>
        <section class="card sec"><h3>Complaints (${reports.length})</h3>${repHtml}</section>
        <section class="card sec"><h3>Listings (${biz.length})</h3>${bizHtml}</section>
      </div>
    </div>
    <div class="pfile-grid">
      <div>${appCard}
        <section class="card sec"><h3>Private notes</h3>
          <textarea id="vNotes" rows="4" class="input mb-2" maxlength="2000" placeholder="What you checked, what you decided, anything to remember">${esc(ad.notes || '')}</textarea>
          <button class="btn-ghost" data-act="vNote" data-user="${esc(uid)}">Save note</button>
        </section>
      </div>
      <div><section class="card sec"><h3>Activity</h3>${logHtml}</section></div>
    </div>`;
}

// Refreshes the codes list whenever a code changes, so a new password shows straight away
function vWatch() {
  if (window.__vWatch) return;
  window.__vWatch = true;
  sb.channel('verification-codes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'verification_codes' }, () => {
      const typing = document.activeElement && document.activeElement.hasAttribute('data-search');
      if (document.querySelector('[data-vcodes]') && !vCurrent && !vPerson && !typing) route();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'code_requests' }, () => {
      const typing = document.activeElement && document.activeElement.hasAttribute('data-search');
      if (document.querySelector('[data-vcodes]') && !vCurrent && !vPerson && !typing) route();
    })
    .subscribe();
}

async function pgVerification() {
  vWatch();
  if (vCurrent) return vReview();
  if (vPerson) return vPersonFile();
  const s = await vStats();
  const stats = `<div class="vstats">${[['pending', 'Pending'], ['approved', 'Verified'], ['rejected', 'Rejected'], ['draft', 'Drafts']]
    .map(([k, t]) => `<div class="vstat ${k}"><b>${s[k]}</b><span>${t}</span></div>`).join('')}</div>`;
  const seg = `<div class="vseg">${[['queue', 'Applications'], ['codes', 'Verified codes']]
    .map(([k, t]) => `<button class="${vTab === k ? 'on' : ''}" data-act="vTab" data-t="${k}">${t}</button>`).join('')}</div>`;
  return stats + seg + (vTab === 'codes' ? await vCodes() : (await dupBlock()) + await vQueue());
}

// Possible duplicate accounts: a warning to check, not proof
async function dupBlock() {
  const { data, error } = await sb.rpc('admin_duplicate_flags');
  if (error) return `<div class="meta text-red-600 mb-3">Could not check for duplicates: ${esc(error.message)}</div>`;
  if (!data || !data.length) return '';
  const rows = data.map(f => item(f.match_value,
    `<div class="name">${esc(f.flag_type)}: ${esc(f.match_value)}</div>
     <div class="meta">Used by ${esc((f.names || []).map(n => n || 'No name').join(', '))}. Check these applications before approving either.</div>`,
    '')).join('');
  return sec('Possible duplicates', 'The same phone number appears on more than one application. This is a warning, not proof.', rows, 'fa-clone', '');
}

async function pgFeatured() {

  if (error) throw error;
  const rows = [...(data || [])].sort((a, b) => (active(b.pro_until) + active(b.featured_until)) - (active(a.pro_until) + active(a.featured_until)));
  const btn = (id, kind, label, cls = 'btn-ghost') => `<button class="${cls}" data-act="promo" data-id="${id}" data-kind="${kind}">${label}</button>`;

  vExport: async () => {
    const withCodes = !!$('vExportCodes')?.checked;
    const { data: apps, error } = await sb.from('verifications')
      .select('user_id, form_data, reviewed_at').eq('status', 'approved');
    if (error) throw error;
    const ids = (apps || []).map(a => a.user_id);
    const [cR, aR] = ids.length ? await Promise.all([
      sb.from('verification_codes').select('user_id, code').in('user_id', ids),
      sb.from('provider_admin').select('user_id, banned, reverify_due').in('user_id', ids),
    ]) : [{ data: [] }, { data: [] }];
    const codeOf = Object.fromEntries((cR.data || []).map(x => [x.user_id, x.code]));
    const adminOf = Object.fromEntries((aR.data || []).map(x => [x.user_id, x]));
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const head = ['Name', 'Phone', 'Email', 'Trade', 'Zone', 'Verified on', 'Banned', 'Re-verify by'];
    if (withCodes) head.push('Login code');
    const rows = (apps || []).map(a => {
      const f = a.form_data || {}, x = adminOf[a.user_id] || {};
      const r = [f.full_name, f.phone, f.email, f.trade, f.zone,
        a.reviewed_at ? new Date(a.reviewed_at).toLocaleDateString('en-NG') : '', x.banned ? 'Yes' : 'No', x.reverify_due || ''];
      if (withCodes) r.push(codeOf[a.user_id] || '');
      return r;
    });
    const csv = [head, ...rows].map(r => r.map(q).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `verified-providers-${new Date().toISOString().slice(0, 10)}${withCodes ? '-with-codes' : ''}.csv`;
    link.click();
    URL.revokeObjectURL(url);
    await audit('provider_export', null, withCodes ? 'with codes' : 'without codes');
    toast('Export ready.');
  },
  reply: async ({ id }) => {
    const text = ($('r-' + id).value || '').trim();
    if (!text) throw new Error('Type a reply first.');
    await fn('support-reply', { id, text });
    await audit('support.reply', id, text.slice(0, 80));
    toast('Reply sent to the student.'); route();
  },
  close: async ({ id }) => { await fn('support-close', { id }); await audit('support.close', id); toast('Chat closed.'); route(); },
  approve: async ({ id }) => {
    // A verification form goes through verify-provider, which issues the login code and sets it as the password
    const { data: form } = await sb.from('verifications').select('id, status').eq('user_id', id).maybeSingle();
    if (form?.status === 'approved') {
      // Approved earlier, but the ID row was never updated, so it stayed on this list. Clear it now.
      const { error: fixErr } = await sb.from('student_verifications')
        .update({ status: 'approved', review_note: null, reviewed_at: new Date().toISOString() })
        .eq('user_id', id);
      if (fixErr) throw fixErr;
      toast('Already approved. Removed from the list.'); route(); return;
    }
    if (form?.status === 'pending') {
      await vCall({ action: 'approve', verification_id: form.id });
      // Also clear the row the Approvals list reads from
      await sb.from('student_verifications')
        .update({ status: 'approved', review_note: null, reviewed_at: new Date().toISOString() })
        .eq('user_id', id);
      await audit('verification.approve', id, 'Approved from the Approvals page');
      toast('Approved. Login code issued.'); route(); return;
    }
    const now = new Date().toISOString();
    const { data, error } = await sb.from('student_verifications').update({ status: 'approved', review_note: null, reviewed_at: now }).eq('user_id', id).select('user_id');
    if (error) throw error;
    if (!data?.length) throw new Error('This ID could not be updated.');
    // The Verified tick goes to listings on an active Pro plan, matching the Pro perks
    await sb.from('businesses').update({ is_verified: true }).eq('owner_id', id).gt('pro_until', now);
    await audit('id.approve', id, 'Student ID approved'); toast('ID approved.'); route();
  },
  reject: async ({ id }) => {
    const { data: form } = await sb.from('verifications').select('id, status').eq('user_id', id).maybeSingle();
    if (form?.status === 'approved') throw new Error('This provider is already approved. Reject is not available.');
    const note = (prompt('Reason the student will see (at least 5 characters):') || '').trim();
    if (note.length < 5) throw new Error('Write a short reason so the student knows what to fix.');
    if (form?.status === 'pending') {
      await vCall({ action: 'reject', verification_id: form.id, reason: note });
      // Also clear the row the Approvals list reads from
      await sb.from('student_verifications')
        .update({ status: 'rejected', review_note: note, reviewed_at: new Date().toISOString() })
        .eq('user_id', id);
      await audit('verification.reject', id, note); toast('Rejection sent.'); route(); return;
    }
    const { error } = await sb.from('student_verifications').update({ status: 'rejected', review_note: note, reviewed_at: new Date().toISOString() }).eq('user_id', id);
    if (error) throw error;
    await audit('id.reject', id, note); toast('Rejection sent.'); route();
  },
  'view-id': async ({ path }) => {
    const { data, error } = await sb.storage.from('student-ids').createSignedUrl(path, 120);
    if (error) throw error;
    window.open(data.signedUrl, '_blank', 'noopener');
  },
  publish: async ({ id, value }) => {

    const { error } = await sb.from('businesses').update({ is_published: v }).eq('id', id);
    if (error) throw error;
    await audit('listing.publish', id, 'is_published=' + v); toast(v ? 'Listing shown.' : 'Listing hidden.'); route();
  },
  verify: async ({ id, value }) => {
    const v = value === 'true';
    const { error } = await sb.from('businesses').update({ is_verified: v }).eq('id', id);
    if (error) throw error;
    await audit('listing.verify', id, 'is_verified=' + v); toast(v ? 'Tick added.' : 'Tick removed.'); route();
  },
  report: async ({ id, status }) => {
    const { error } = await sb.from('reports').update({ status }).eq('id', id);
    if (error) throw error;
    await audit('report.' + status, id); route();
  },
  promo: async ({ id, kind }) => {
    const { data: b, error: readErr } = await sb.from('businesses').select('owner_id, featured_until, pro_until').eq('id', id).single();
    if (readErr) throw readErr;
    // Extend from the current end date if it is still active, otherwise from now
    const add = (d, n) => new Date((active(d) ? new Date(d) : new Date()).getTime() + n * DAY).toISOString();
    let upd;
    if (kind === 'none') upd = { featured_until: null, pro_until: null };
    else if (kind === 'featured') {
      if (active(b.pro_until)) throw new Error('This listing is on Pro, and Pro replaces Featured.');
      upd = { featured_until: add(b.featured_until, 7) };
    } else if (kind === 'trial') {
      upd = { pro_until: add(b.pro_until, 3), featured_until: null };
      // Mark the trial as used, so the provider cannot start their own free trial afterwards
      await sb.from('profiles').update({ trial_started_at: new Date().toISOString() }).eq('id', b.owner_id).is('trial_started_at', null);
    } else upd = { pro_until: add(b.pro_until, 30), featured_until: null };
    const { error } = await sb.from('businesses').update(upd).eq('id', id);
    if (error) throw error;
    await audit('promo.' + kind, id, JSON.stringify(upd)); toast('Saved.'); route();
  },
  'cat-add': async () => {
    const name = $('cn').value.trim();
    const icon = $('ci').value.trim().replace(/^fa-solid\s+/, '') || 'fa-tag';
    if (!name) throw new Error('Type a category name first.');
    const { data: last } = await sb.from('categories').select('position').order('position', { ascending: false }).limit(1);
    const { error } = await sb.from('categories').insert({ name, icon, position: ((last?.[0]?.position) || 0) + 1 });
    if (error) throw new Error(error.message.includes('duplicate') ? 'That category already exists.' : error.message);
    await audit('category.add', null, name); toast('Category added.'); route();
  },
  'cat-del': async ({ name }) => {
    if (!confirm(`Remove "${name}"? Existing listings keep their category.`)) return;
    const { error } = await sb.from('categories').delete().eq('name', name);
    if (error) throw error;
    await audit('category.remove', null, name); route();
  },
  save: async ({ provider, clear, extra }) => {
    const key = clear ? '' : ($('k-' + provider).value || '').trim();
    if (!clear && !key) throw new Error('Paste a key first.');
    try { await fn('save', { provider, key }); }
    catch (e) { throw new Error(extra ? `ai-proxy does not accept "${provider}" yet. Add it to the function first. (${e.message})` : e.message); }
    await audit('ai.key.' + (clear ? 'remove' : 'save'), provider, clear ? 'Saved key removed' : 'Key replaced');
    toast(clear ? 'Saved key removed.' : 'Key saved. Test it to confirm the connection.'); route();
  },
  test: async ({ provider, extra }) => {
    toast('Checking…');
    let r;
    try { r = await fn('test', { provider }); }
    catch (e) { throw new Error(extra ? `ai-proxy does not know "${provider}" yet. Add it to the function first.` : e.message); }
    toast(r.ok ? `Connected (${r.ms} ms)` : 'Not connected: ' + r.error, r.ok ? 'ok' : 'bad'); route();
  },
  'test-all': async () => {
    toast('Checking all providers…');
    const { results } = await fn('test-all');
    const n = results.filter(r => r.ok).length;
    toast(`${n} of ${results.length} connected.`, n ? 'ok' : 'bad'); route();
  },
};

function tplFill(key) {
  const [subject, body] = TEMPLATES[key];
  const vars = { name: $('tplName').value.trim() || 'there', business: $('tplBiz').value.trim() || 'your listing' };
  const fill = t => t.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  // The Subject box starts with the template's subject and can be changed before sending
  return [$('tplSubject').value.trim() || fill(subject), fill(body)];
}
function previewTpl(reset) {
  if (!$('tplPick')) return;
  if (reset === true) $('tplSubject').value = TEMPLATES[$('tplPick').value][0];
  const [subject, body] = tplFill($('tplPick').value);
  $('tplSubj').textContent = subject;
  $('tplBody').textContent = body;
}
let tplPicked = new Set(); // people chosen by hand in the "Choose people" list
async function tplRecipients(aud) {
  if (aud === 'picked') return [...tplPicked];
  if (aud === 'pending') {
    const { data } = await sb.from('student_verifications').select('user_id').eq('status', 'pending');
    return [...new Set((data || []).map(r => r.user_id))];
  }
  if (aud === 'providers' || aud === 'pro') {
    const { data } = await sb.from('businesses').select('owner_id, pro_until');
    return [...new Set((data || []).filter(b => aud === 'providers' || active(b.pro_until)).map(b => b.owner_id))];
  }
  const { data } = await sb.from('profiles').select('id');
  return (data || []).map(p => p.id);
}
async function tplEmails(ids) {
  const wanted = new Set(ids);
  const { data } = await sb.from('profiles').select('id, email');
  return (data || []).filter(p => wanted.has(p.id) && p.email).map(p => p.email);
}

function updateTplCount() {
  const el = $('tplCount'); if (el) el.textContent = `${tplPicked.size} selected`;
}
async function showTplPeople() {
  const box = $('tplPeople');
  if (!box) return;
  const on = $('tplAud').value === 'picked';
  box.hidden = !on;
  if (!on || box.dataset.loaded) { updateTplCount(); return; }
  box.innerHTML = '<p class="meta mt-3">Loading people…</p>';
  const { data, error } = await sb.from('profiles').select('id, full_name, email').order('full_name');
  if (error) { box.innerHTML = `<p class="meta mt-3 text-red-600">${esc(error.message)}</p>`; return; }
  box.dataset.loaded = '1';
  const rows = (data || []).map(p => {
    const q = `${p.full_name || ''} ${p.email || ''}`.toLowerCase();
    return `<label class="row" data-q="${esc(q)}" style="cursor:pointer">
      <input type="checkbox" class="tpl-person" value="${esc(p.id)}" ${tplPicked.has(p.id) ? 'checked' : ''} style="width:18px;height:18px;flex:none">
      <div class="grow"><div class="name">${esc(p.full_name || 'No name')}</div><div class="meta">${esc(p.email || 'No email')}</div></div>
    </label>`;
  }).join('');
  box.innerHTML = `<div class="card p-4 mt-4" style="box-shadow:none;background:#f9fafb">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <div class="name">Choose people</div>
      <div class="acts"><button type="button" class="btn-ghost" data-act="tpl-all">Select all shown</button><button type="button" class="btn-ghost" data-act="tpl-none">Clear</button></div>
    </div>
    <input class="input mb-2" data-search placeholder="Search by name or email">
    <div class="meta mb-1" id="tplCount"></div>
    <div style="max-height:360px;overflow-y:auto">${rows || '<p class="meta">No accounts yet.</p>'}</div>
  </div>`;
  updateTplCount();
}

async function pgAgent() {
  await sb.rpc('agent_run_now', { force: false }); // runs at most every 20 minutes
  const { data, error } = await sb.from('agent_log').select('id, created_at, task, summary, needs_human, resolved')
    .order('created_at', { ascending: false }).limit(150);
  if (error) throw error;
  const open = (data || []).filter(l => l.needs_human && !l.resolved);
  const badge = document.querySelector('[data-badge="agent"]');
  if (badge) badge.innerHTML = open.length ? pill(open.length, 'warn') : '';
  return `<section class="card sec">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><h2 class="text-lg font-bold">AI agent</h2>
        <p class="meta">It handles routine admin work on its own and logs every change below. It only messages you about things that need a person, and those also appear under Needs you.</p></div>
      <button class="btn" data-act="agent-run"><i class="fa-solid fa-rotate"></i> Run now</button>
    </div></section>
    ${sec('Needs you', 'Handle these, then tap Mark done.', open.map(l => item(l.summary,
      `<div class="name">${esc(l.summary)}</div><div class="meta">${fmt(l.created_at)}</div>`,
      `<button class="btn-ghost" data-act="agent-done" data-id="${l.id}">Mark done</button>`)).join(''), 'fa-circle-check', 'Nothing needs you right now.')}
    ${sec('What the agent did', 'Newest first.', (data || []).filter(l => !(l.needs_human && !l.resolved)).map(l => item(l.summary,
      `<div class="meta">${fmt(l.created_at)} · ${esc(l.task)}</div><div class="text-sm text-gray-700">${esc(l.summary)}</div>`)).join(''),
      'fa-user-gear', 'The agent has not changed anything yet.', search('Search activity'))}`;
}

async function pgTemplates() {
  tplPicked = new Set();
  setTimeout(() => previewTpl(true), 0);
  return `<section class="card sec">
    <h2 class="text-lg font-bold">Email templates</h2>
    <p class="meta mb-3">Pick a template and fill in the blanks. Send it in the app, or open it in your email app to send from there.</p>
    <div class="grid md:grid-cols-2 gap-3">
      <div><label class="lbl">Template</label><select id="tplPick" class="input">${Object.entries(TEMPLATES).map(([k, t]) => `<option value="${k}">${esc(t[0])}</option>`).join('')}</select></div>
      <div><label class="lbl">Who gets it</label><select id="tplAud" class="input">
        <option value="all">Everyone with an account</option>
        <option value="providers">Everyone with a listing</option>
        <option value="pro">Pro providers</option>
        <option value="pending">Students with an ID waiting</option>
        <option value="picked">Choose people…</option>
      </select></div>
      <div><label class="lbl">Name (fills {name})</label><input id="tplName" class="input" placeholder="Leave blank to say there"></div>
      <div><label class="lbl">Business (fills {business})</label><input id="tplBiz" class="input" placeholder="e.g. Code X"></div>
      <div class="md:col-span-2"><label class="lbl">Subject</label><input id="tplSubject" class="input" maxlength="120" placeholder="Subject line"></div>
    </div>
    <div id="tplPeople" hidden></div>
    <div class="card p-4 mt-4" style="box-shadow:none;background:#f9fafb"><div class="meta">Subject</div><div class="name" id="tplSubj"></div><div class="text-sm text-gray-700 mt-2 whitespace-pre-wrap" id="tplBody"></div></div>
    <div class="acts mt-3">
      <button class="btn" data-act="tpl-send"><i class="fa-solid fa-paper-plane"></i> Send in app</button>
      <button class="btn-ghost" data-act="tpl-mail"><i class="fa-regular fa-envelope"></i> Open in email app</button>
      <button class="btn-ghost" data-act="tpl-copy">Copy emails</button>
    </div>
  </section>`;
}

Object.assign(ACT, {
  'an-view': async ({ v }) => { anView = v; $('main').innerHTML = anHtml(); },
  'an-days': async ({ d }) => { anDays = Number(d); $('main').innerHTML = anHtml(); },
  'ai-filter': async ({ f }) => {
    document.querySelectorAll('[data-fchip]').forEach(c => c.classList.toggle('on', c.dataset.f === f));
    document.querySelectorAll('#main [data-state]').forEach(c => { c.hidden = f !== 'all' && c.dataset.state !== f; });
  },
  'agent-run': async () => {
    const r = await sb.rpc('agent_run_now', { force: true });
    if (r.error) throw r.error;
    toast(`Agent finished. ${r.data ?? 0} change(s).`); route();
  },
  'agent-done': async ({ id }) => {
    const { error } = await sb.from('agent_log').update({ resolved: true, resolved_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    toast('Marked done.'); route();
  },
  'tpl-all': async () => {
    document.querySelectorAll('#tplPeople [data-q]').forEach(r => {
      if (r.hidden) return;
      const cb = r.querySelector('.tpl-person'); if (cb) { cb.checked = true; tplPicked.add(cb.value); }
    });
    updateTplCount();
  },
  'tpl-none': async () => {
    tplPicked.clear();
    document.querySelectorAll('.tpl-person').forEach(cb => { cb.checked = false; });
    updateTplCount();
  },
  'tpl-send': async () => {
    const [subject, body] = tplFill($('tplPick').value);
    const ids = await tplRecipients($('tplAud').value);
    if (!ids.length) throw new Error('No one is selected for that audience.');
    if (!confirm(`Send "${subject}" to ${ids.length} people in the app?`)) return;
    for (let i = 0; i < ids.length; i += 200) {
      const { error } = await sb.from('admin_messages').insert(ids.slice(i, i + 200).map(id => ({ recipient_id: id, subject, body })));
      if (error) throw error;
    }
    await audit('email.template', null, `${$('tplPick').value} to ${$('tplAud').value} (${ids.length})`);
    toast(`Sent to ${ids.length} people.`); route();
  },
  'tpl-mail': async () => {
    const [subject, body] = tplFill($('tplPick').value);
    const emails = await tplEmails(await tplRecipients($('tplAud').value));
    if (!emails.length) throw new Error('No email addresses for that audience.');
    location.href = 'mailto:?bcc=' + encodeURIComponent(emails.slice(0, 40).join(',')) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    if (emails.length > 40) toast(`Opened the first 40 of ${emails.length}. Use Copy emails for the rest.`);
  },
  'tpl-copy': async () => {
    const emails = await tplEmails(await tplRecipients($('tplAud').value));
    try { await navigator.clipboard.writeText(emails.join(', ')); toast(`${emails.length} emails copied.`); }
    catch (_) { throw new Error('Could not copy. Select the list in your email app instead.'); }
  },
});

Object.assign(PAGES, {
  agent: { t: 'AI agent', i: 'fa-user-gear', g: 'Overview', f: pgAgent },
  templates: { t: 'Email templates', i: 'fa-envelope', g: 'People', f: pgTemplates },
});

$('main').addEventListener('input', e => { if (['tplName', 'tplBiz', 'tplSubject'].includes(e.target.id)) previewTpl(); });
$('main').addEventListener('change', e => {
  if (e.target.id === 'tplPick') previewTpl(true);
  else if (e.target.id === 'tplAud') { previewTpl(); showTplPeople(); }
  else if (e.target.matches('.tpl-person')) {
    if (e.target.checked) tplPicked.add(e.target.value); else tplPicked.delete(e.target.value);
    updateTplCount();
  }
});

// ============ ROUTER AND SHELL ============
const GROUPS = { Overview: 'fa-gauge-high', Providers: 'fa-store', Content: 'fa-layer-group', People: 'fa-users', System: 'fa-gear' };
function shutGroups() { try { return JSON.parse(localStorage.getItem('uw_nav_shut') || '[]'); } catch (_) { return []; } }
function buildNav() {
  const shut = shutGroups();
  $('nav').innerHTML = Object.entries(GROUPS).map(([g, gi]) => {
    const closed = shut.includes(g);
    const links = Object.entries(PAGES).filter(([, p]) => p.g === g).map(([k, p]) =>
      `<a class="navitem" href="#/${k}" data-nav="${k}"><i class="fa-solid ${p.i}"></i><span class="flex-1">${p.t}</span><span data-badge="${k}"></span></a>`).join('');
    return `<div><button type="button" class="grp" data-grp="${g}" aria-expanded="${!closed}"><span><i class="fa-solid ${gi} mr-2"></i>${g}</span><i class="fa-solid fa-chevron-down text-[10px]" style="transition:transform .15s;${closed ? 'transform:rotate(-90deg)' : ''}"></i></button><div class="nbody" ${closed ? 'hidden' : ''}>${links}</div></div>`;
  }).join('');
}
$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-grp]'); if (!b) return;
  const body = b.nextElementSibling, shut = body.hidden;
  body.hidden = !shut; b.setAttribute('aria-expanded', shut);
  b.lastElementChild.style.transform = shut ? '' : 'rotate(-90deg)';
  const list = shutGroups().filter(x => x !== b.dataset.grp); if (!shut) list.push(b.dataset.grp);
  try { localStorage.setItem('uw_nav_shut', JSON.stringify(list)); } catch (_) {}
});

async function route() {
  if (!me) return;
  const k = location.hash.slice(2);
  const key = Object.prototype.hasOwnProperty.call(PAGES, k) ? k : 'analytics';
  const my = ++rid;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === key));
  $('title').textContent = PAGES[key].g + ' › ' + PAGES[key].t;
  document.querySelector(`[data-nav="${key}"]`)?.closest('.nbody')?.removeAttribute('hidden');
  drawer(false);
  $('main').innerHTML = '<div class="grid gap-3"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  let html;
  try { html = await PAGES[key].f(); }
  catch (e) { html = `<div class="card p-6 text-red-600">${esc(e.message || e)}</div>`; }
  if (my === rid) $('main').innerHTML = html; // ignore a page the admin has already left
}

// One handler for every button, so redrawing a page never loses it
$('main').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  el.disabled = true;
  try { await ACT[el.dataset.act](el.dataset); }
  catch (err) { toast(err.message || 'Something went wrong.', 'bad'); }
  finally { el.disabled = false; }
});
// Live search for every list
$('main').addEventListener('input', e => {
  if (!e.target.matches('[data-search]')) return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#main [data-q]').forEach(r => { r.hidden = !r.dataset.q.includes(q); });
});

const ACCENTS = { plum: ['Plum', '#4b1049'], ocean: ['Ocean', '#0b4f8a'], forest: ['Forest', '#14653f'], sunset: ['Sunset', '#c2410c'] };
function markAccent() {
  const cur = document.documentElement.dataset.accent || 'plum';
  document.querySelectorAll('[data-accent-pick]').forEach(b => { const on = b.dataset.accentPick === cur; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
function setAccent(k, save = true) {
  if (!ACCENTS[k]) k = 'plum';
  document.documentElement.dataset.accent = k;
  if (save) { try { localStorage.setItem('uw_accent', k); } catch (_) {} }
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', ACCENTS[k][1]);
  markAccent();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-accent-pick]'); if (b) setAccent(b.dataset.accentPick); });

$('menu').onclick = () => drawer(!$('drawer').classList.contains('open'));
$('scrim').onclick = () => drawer(false);
$('dark').onclick = () => setDark(!document.documentElement.classList.contains('dark'));
setDark(localStorage.getItem('uw_dark') === '1');

// ============ SIGN IN ============
$('lf').onsubmit = async e => {
  e.preventDefault();
  $('lmsg').textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('le').value.trim(), password: $('lp').value });
  if (error) { $('lmsg').textContent = error.message; return; }
  enter(data.user);
};
$('logout').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { me = null; $('app').hidden = true; $('login').hidden = false; } });

async function enter(user) {
  // This only hides the page from other accounts. Row Level Security is the real protection.
  if ((user.email || '').toLowerCase() !== ADMIN) {
    await sb.auth.signOut();
    $('lmsg').textContent = 'This account is not an admin.';
    return;
  }
  me = user;
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = user.email;
  buildNav();
  if (!location.hash) location.hash = '#/analytics';
  route();
  badgeCount();
}
window.addEventListener('hashchange', route);
setInterval(() => { if (me) badgeCount(); }, 60000);
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(data.session.user);
  else $('login').hidden = false;
})();
</script>
